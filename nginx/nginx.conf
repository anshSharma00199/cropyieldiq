worker_processes auto;
events { worker_connections 1024; }

http {
  server_tokens off;
  resolver 127.0.0.11 valid=10s ipv6=off;      # Docker DNS: re-resolve so new/removed api replicas are picked up
  gzip on;
  gzip_types application/json text/plain text/css application/javascript;
  client_max_body_size 64k;

  log_format json_combined escape=json
    '{"ts":"$time_iso8601","ip":"$remote_addr","method":"$request_method","uri":"$request_uri",'
    '"status":$status,"bytes":$body_bytes_sent,"rt":$request_time,"upstream_rt":"$upstream_response_time",'
    '"cache":"$upstream_cache_status","request_id":"$request_id"}';
  access_log /var/log/nginx/access.log json_combined;

  # Edge rate limits (the app has its own per-user/IP limits as a second layer)
  limit_req_zone $binary_remote_addr zone=api:10m  rate=20r/s;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
  limit_req_status 429;
  proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=meta:10m max_size=50m inactive=1h use_temp_path=off;

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  server {
    listen 80;
    # Behind Cloudflare/ALB, add: set_real_ip_from <their ranges>; real_ip_header CF-Connecting-IP;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    # After enabling TLS add: add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location = /metrics { return 404; }                       # metrics are internal only (Prometheus scrapes api directly)

    location /api/v1/auth/ {
      limit_req zone=auth burst=5 nodelay;
      set $api http://api:8000;
      proxy_pass $api;
      include /etc/nginx/proxy_common.conf;
    }

    location = /api/v1/meta {                                  # public + identical for everyone: cache at the edge
      proxy_cache meta;
      proxy_cache_valid 200 1h;
      proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
      add_header X-Cache-Status $upstream_cache_status always;
      set $api http://api:8000;
      proxy_pass $api;
      include /etc/nginx/proxy_common.conf;
    }

    location /api/ {
      limit_req zone=api burst=40 nodelay;
      set $api http://api:8000;
      proxy_pass $api;
      include /etc/nginx/proxy_common.conf;
    }

    location /health/ {
      set $api http://api:8000;
      proxy_pass $api;
      include /etc/nginx/proxy_common.conf;
    }

    location / {                                               # Streamlit UI (needs websockets)
      set $ui http://frontend:8501;
      proxy_pass $ui;
      include /etc/nginx/proxy_common.conf;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 300s;
    }
  }

  # TLS server block (enable after obtaining a certificate, see docs/DEPLOYMENT.md):
  # server { listen 443 ssl http2; ssl_certificate /etc/letsencrypt/live/DOMAIN/fullchain.pem; ... same locations ... }
  # server { listen 80; return 301 https://$host$request_uri; }
}
